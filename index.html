<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="rgb(20,17,15)">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prentice1 · Aesthetic injector training and placement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=DM+Mono&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
  --paper:#FCF8F2; --paper-2:#F7F0E5; --ink:#14110F; --text:#221A14; --muted:#6C5C4B;
  --gold:#C9A96E; --gold-deep:#7A5E28; --line:#E4D8C4; --ok:#2F6B45; --err:#9B2C1F;
  --serif:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans:'DM Sans', 'Helvetica Neue', Arial, sans-serif;
  --mono:'DM Mono', ui-monospace, Menlo, monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--paper:#14110F;--paper-2:#1E1915;--ink:#FCF8F2;--text:#EDE4D6;--muted:#B5A590;--gold-deep:#D9BC86;--line:#3A3129;--ok:#7FC79A;--err:#F0937F}
}
:root[data-theme="dark"]{--paper:#14110F;--paper-2:#1E1915;--ink:#FCF8F2;--text:#EDE4D6;--muted:#B5A590;--gold-deep:#D9BC86;--line:#3A3129;--ok:#7FC79A;--err:#F0937F}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--gold-deep)}
img{max-width:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 28px}
h1,h2,h3{font-family:var(--serif);font-weight:300;color:var(--ink);margin:0;letter-spacing:-0.01em}
h1{font-size:clamp(52px,8vw,104px);line-height:0.95}
h2{font-size:clamp(36px,5vw,58px);line-height:1.02}
h3{font-size:30px;line-height:1.1}
p{margin:0}
.lede{font-size:19px;max-width:600px}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-family:var(--mono);font-size:13px;color:var(--gold-deep)}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--paper) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.mark{font-family:var(--sans);font-weight:700;font-size:24px;letter-spacing:-0.01em;color:var(--ink);text-decoration:none}
.mark span{font-weight:400;color:var(--gold)}
.links{display:flex;gap:28px;align-items:center}
.links a{color:var(--text);text-decoration:none;font-size:15px}
.links a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -1px 0 var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--paper);border:1px solid var(--ink);padding:13px 22px;font-weight:500;font-size:15px;text-decoration:none;cursor:pointer;border-radius:2px}
.btn:hover{background:var(--text)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--paper-2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#14110F}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.menu{display:none;background:none;border:1px solid var(--line);padding:8px 12px;border-radius:2px;cursor:pointer}
@media (max-width:820px){
  .links{display:none;position:absolute;top:68px;left:0;right:0;background:var(--paper);flex-direction:column;align-items:flex-start;padding:16px 28px 24px;border-bottom:1px solid var(--line);gap:16px}
  .links.open{display:flex}
  .menu{display:block}
}

/* sections */
section{padding:88px 0}
.rule{border-top:1px solid var(--line)}
.hero{padding:80px 0 64px}
.hero-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:56px;align-items:end}
.cohort{border:1px solid var(--line);background:var(--paper-2);padding:28px}
.cohort dl{display:grid;grid-template-columns:auto 1fr;gap:10px 20px;margin:18px 0 22px}
.cohort dt{color:var(--muted);font-size:14px}
.cohort dd{margin:0;font-size:15px;color:var(--ink)}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr;gap:36px}}

/* timeline: the one bold element */
.path{margin-top:72px}
.track{display:grid;grid-template-columns:repeat(7,1fr);position:relative;margin-top:28px}
.track::before{content:"";position:absolute;left:0;right:0;top:22px;height:1px;background:var(--line)}
.wk{position:relative;padding-right:14px;background:none;border:0;text-align:left;cursor:pointer;color:inherit}
.wk .dot{width:45px;height:45px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;font-family:var(--serif);font-size:22px;color:var(--ink);position:relative}
.wk[aria-pressed="true"] .dot{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.wk.hire .dot{background:var(--gold);border-color:var(--gold);color:#14110F}
.wk .lbl{display:block;margin-top:12px;font-size:14px;line-height:1.35;color:var(--muted)}
.wk[aria-pressed="true"] .lbl{color:var(--ink)}
.wkdetail{margin-top:28px;border-left:2px solid var(--gold);padding:4px 0 4px 20px;max-width:640px;min-height:58px}
@media (max-width:700px){
  .track{grid-template-columns:repeat(4,1fr);row-gap:26px}
  .track::before{display:none}
}

.facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--ink)}
.facts>div{padding:24px 24px 24px 0;border-right:1px solid var(--line)}
.facts>div+div{padding-left:24px}
.facts>div:last-child{border-right:0}
.facts b{display:block;font-family:var(--serif);font-weight:300;font-size:56px;line-height:1;color:var(--ink)}
@media (max-width:700px){.facts{grid-template-columns:1fr}.facts>div{border-right:0;border-bottom:1px solid var(--line);padding-left:0!important}}

.aud{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--ink)}
.aud a{display:block;padding:28px 28px 32px 0;text-decoration:none;color:inherit;border-right:1px solid var(--line)}
.aud a+a{padding-left:28px}
.aud a:last-child{border-right:0}
.aud a:hover h3{text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:6px;text-decoration-thickness:1px}
.aud p{margin-top:10px;color:var(--muted)}
.aud .go{margin-top:18px;display:inline-block;color:var(--gold-deep);font-weight:500;font-size:15px}
@media (max-width:820px){.aud{grid-template-columns:1fr}.aud a{border-right:0;border-bottom:1px solid var(--line);padding-left:0!important}}

.two{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
@media (max-width:820px){.two{grid-template-columns:1fr;gap:36px}}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.list li{padding:14px 0;border-bottom:1px solid var(--line);display:flex;gap:16px}
.list li .num{padding-top:4px;min-width:22px}
.price{font-family:var(--serif);font-weight:300;font-size:72px;line-height:1;color:var(--ink)}
.panel{background:var(--paper-2);border-top:2px solid var(--gold);padding:28px}

/* tiers */
.tiers{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:14px 12px;text-align:center;border-bottom:1px solid var(--line);font-size:15px}
th:first-child,td:first-child{text-align:left;padding-left:0}
thead th{border-bottom:2px solid var(--ink);vertical-align:bottom;font-weight:400}
thead .t{font-family:var(--serif);font-weight:300;font-size:44px;color:var(--ink);line-height:1;display:block;margin-top:4px}
thead .n{font-size:14px;color:var(--muted)}
th.feat{background:var(--ink)}
th.feat .t,th.feat .n{color:var(--paper)}
th.feat .n{color:var(--gold)}
td.feat{background:var(--paper-2)}
.yes{color:var(--gold-deep)}
tfoot td{border-bottom:0;padding-top:20px}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;border-top:1px solid var(--ink);padding-top:24px}
.steps h3{font-size:26px;margin:8px 0 8px}
@media (max-width:820px){.steps{grid-template-columns:1fr}}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line)}
.compare>div{padding:28px}
.compare .them{color:var(--muted)}
.compare .them .price{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px}
.compare .us{background:var(--ink);color:var(--paper)}
.compare .us .price{color:var(--paper)}
@media (max-width:700px){.compare{grid-template-columns:1fr}}

/* checkout */
.co{display:grid;grid-template-columns:1.35fr 1fr;gap:56px;align-items:start;padding:56px 0 96px}
@media (max-width:900px){.co{grid-template-columns:1fr;gap:32px}.summary{order:-1}}
.progress{display:flex;gap:24px;margin-bottom:32px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.progress span[aria-current="step"]{color:var(--ink);box-shadow:inset 0 -1px 0 var(--gold)}
.demo{background:var(--paper-2);border:1px dashed var(--gold);padding:12px 16px;font-size:14px;margin-bottom:28px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.field label{font-size:14px;color:var(--ink);font-weight:500}
.field input,.field select{background:var(--paper);border:1px solid var(--line);padding:12px 14px;border-radius:2px;width:100%}
.field input:focus,.field select:focus{border-color:var(--ink);outline:none}
.field .hint{font-size:13px;color:var(--muted)}
.field .msg{font-size:13px;color:var(--err);min-height:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:16px}
@media (max-width:560px){.row,.row3{grid-template-columns:1fr}}
.choice{display:block;border:1px solid var(--line);padding:18px 20px;margin-bottom:12px;cursor:pointer;background:var(--paper)}
.choice:has(input:checked){border-color:var(--ink);box-shadow:inset 3px 0 0 var(--gold)}
.choice input{margin-right:10px;accent-color:#7A5E28}
.choice b{font-weight:500;color:var(--ink)}
.choice .muted{display:block;margin-top:4px;margin-left:26px;font-size:14px}
.summary{border:1px solid var(--line);padding:28px;position:sticky;top:96px;background:var(--paper)}
.summary .line{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.summary .total{display:flex;justify-content:space-between;align-items:baseline;padding-top:16px}
.summary .total b{font-family:var(--serif);font-weight:300;font-size:40px;color:var(--ink)}
.actions{display:flex;gap:12px;align-items:center;margin-top:28px;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline;padding:8px 0}
.cherry{border:1px solid var(--line);padding:22px;background:var(--paper-2);margin-top:8px}
.spinner{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* confirmation + email */
.done{padding:80px 0 96px;max-width:720px}
.check{width:56px;height:56px;border-radius:50%;background:var(--gold);display:grid;place-items:center;margin-bottom:28px}
.receipt{border:1px solid var(--line);margin:32px 0;padding:24px}
.receipt .line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px;gap:16px}
.receipt .line:last-child{border-bottom:0}
.mailclient{border:1px solid var(--line);margin:40px auto 96px;max-width:760px;background:var(--paper)}
.mailbar{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted);gap:12px;flex-wrap:wrap}
.mailhead{padding:22px 24px;border-bottom:1px solid var(--line)}
.mailhead .subj{font-size:22px;color:var(--ink);font-weight:500;line-height:1.3}
.mailhead .from{font-size:14px;color:var(--muted);margin-top:6px}
.mailbody{padding:36px 24px 44px;background:#FCF8F2;color:#221A14}
.mailbody .card{max-width:560px;margin:0 auto}
.mailbody .mk{font-family:var(--sans);font-weight:700;font-size:22px;color:#14110F}
.mailbody .mk span{font-weight:400;color:#C9A96E}
.mailbody h2{color:#14110F;font-size:40px;margin:28px 0 14px}
.mailbody .cta{display:inline-block;background:#14110F;color:#FCF8F2;text-decoration:none;padding:14px 26px;font-weight:500;margin:24px 0;border:0;cursor:pointer;font-size:16px}
.mailbody .foot{margin-top:28px;padding-top:18px;border-top:1px solid #E4D8C4;font-size:13px;color:#6C5C4B}
.next{list-style:none;padding:0;margin:28px 0 0;border-top:1px solid var(--ink)}
.next li{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.next .state{min-width:96px;font-size:14px;color:var(--muted)}
.next .state.ok{color:var(--ok)}

.band{background:transparent;color:var(--text)}
.band h1,.band h2,.band h3{color:var(--ink)}
.band h1{font-size:clamp(46px,5.6vw,76px);line-height:1}
.band-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:48px;align-items:end;padding-top:64px}
.band-text{padding-bottom:64px}
.band .photo{display:block;width:100%;aspect-ratio:5/6;object-fit:cover}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:20px}
.tagline{font-family:var(--serif);font-style:italic;font-weight:300;font-size:30px;color:var(--gold);margin-top:18px}
.band .lede{color:var(--text)}
.band .btn.ghost{color:var(--ink);border-color:var(--muted)}
.band .btn.ghost:hover{background:var(--paper-2)}
@media (max-width:860px){.band-grid{grid-template-columns:1fr;gap:32px}.band-text{padding-bottom:0}.band .photo{aspect-ratio:4/3}}
.cohortbar{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:24px;align-items:center;padding:24px 0;border-bottom:1px solid var(--line);margin:0}
.cohortbar dt{font-size:13px;color:var(--muted)}
.cohortbar dd{margin:2px 0 0;color:var(--ink);font-size:16px}
@media (max-width:860px){.cohortbar{grid-template-columns:1fr 1fr}}
.wk .date{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.fac{display:grid;grid-template-columns:1.3fr 1fr;gap:48px;align-items:start}
@media (max-width:860px){.fac{grid-template-columns:1fr}}
.lead{border-top:2px solid var(--ink);padding-top:28px}
.mono{width:88px;height:88px;border-radius:50%;background:#14110F;color:#C9A96E;display:grid;place-items:center;font-family:var(--serif);font-size:34px;margin-bottom:22px}
.creds{list-style:none;padding:0;margin:22px 0 0;border-top:1px solid var(--line)}
.creds li{padding:11px 0;border-bottom:1px solid var(--line);font-size:16px}
.oneone{border:1px solid var(--line);padding:24px;margin-bottom:16px;background:var(--paper-2)}
.oneone .who{color:var(--ink);font-weight:500;margin-top:10px}
.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;background:var(--paper-2)}
.avatar.lg{width:128px;height:128px;margin-bottom:22px;display:block}
.person{display:flex;gap:14px;align-items:center;margin-top:16px}
.oneone .tag{font-size:13px;color:var(--gold-deep)}

.fac{display:block}
.lead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:48px;align-items:end;border-top:2px solid var(--ink);padding-top:32px;margin-bottom:40px}
.portrait{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center top;background:var(--paper-2)}
.lead h3{font-size:clamp(40px,4.4vw,56px)!important}
.oneones{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.oneones .oneone{margin-bottom:0}
@media (max-width:860px){.lead{grid-template-columns:1fr;gap:28px}.oneones{grid-template-columns:1fr}}
.select{display:grid;grid-template-columns:auto auto 1fr;gap:56px;align-items:center;padding:56px 0;border-bottom:1px solid var(--line)}
.select .big{font-family:var(--serif);font-weight:300;font-size:clamp(88px,11vw,148px);line-height:.85;color:var(--ink)}
.select .big small{display:block;font-family:var(--sans);font-size:15px;color:var(--muted);margin-top:14px;letter-spacing:0}
.select .gold{color:var(--gold-deep)}
@media (max-width:860px){.select{grid-template-columns:1fr 1fr;gap:28px}.select>p,.select>div:last-child{grid-column:1/-1}}

/* ---- motion ---- */
#prog{position:fixed;top:0;left:0;right:0;height:2px;background:var(--gold);transform-origin:0 50%;transform:scaleX(0);z-index:50}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em;margin-bottom:-.1em}
.w>span{display:inline-block;transform:translateY(108%);animation:rise 1.15s cubic-bezier(.16,.84,.24,1) forwards;animation-delay:calc(var(--i)*65ms + 120ms)}
@keyframes rise{to{transform:none}}
.hf{opacity:0;animation:fadeup 1s cubic-bezier(.16,.84,.24,1) forwards;animation-delay:var(--d,.5s)}
@keyframes fadeup{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.band .photo{animation:unveil 1.6s cubic-bezier(.7,0,.2,1) .25s both}
@keyframes unveil{from{clip-path:inset(100% 0 0 0);transform:scale(1.14)}to{clip-path:inset(0 0 0 0);transform:scale(1)}}
.rv{opacity:0;transform:translateY(36px);transition:opacity 1s cubic-bezier(.16,.84,.24,1) var(--d,0s),transform 1s cubic-bezier(.16,.84,.24,1) var(--d,0s)}
.rv.in{opacity:1;transform:none}
.clip{clip-path:inset(0 0 100% 0);transform:scale(1.1);transition:clip-path 1.5s cubic-bezier(.7,0,.2,1),transform 1.8s cubic-bezier(.16,.84,.24,1)}
.clip.in{clip-path:inset(0 0 0 0);transform:scale(1)}
.track::before{transform:scaleX(0);transform-origin:0 50%;transition:transform 1.8s cubic-bezier(.65,0,.2,1) .2s}
.track.in::before{transform:scaleX(1)}
.wk .dot{transition:transform .5s cubic-bezier(.16,.84,.24,1),background .3s,color .3s,border-color .3s}
.wk:hover .dot{transform:scale(1.12)}
.btn{transition:transform .35s cubic-bezier(.16,.84,.24,1),background .3s,color .3s}
.btn:hover{transform:translateY(-2px)}
.select .big{display:inline-block}
@media (prefers-reduced-motion:reduce){.w>span,.hf{transform:none!important;opacity:1!important}.rv,.clip{opacity:1;transform:none;clip-path:none}.track::before{transform:none}#prog{display:none}}
.hands{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:2px solid var(--ink)}
.hands>div{padding:36px 40px 40px 0}
.hands>div+div{padding-left:40px;border-left:1px solid var(--line)}
.hands .k{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-deep)}
.hands h3{font-size:clamp(40px,4.6vw,60px);line-height:1;margin:14px 0 16px}
.hands p{max-width:440px}
.hands svg{display:block;width:100%;max-width:380px;height:auto;margin-top:28px}
@media (max-width:820px){.hands{grid-template-columns:1fr}.hands>div,.hands>div+div{padding:28px 0;border-left:0}.hands>div+div{border-top:1px solid var(--line)}}
.shot{display:block;width:100%;height:auto;border:1px solid var(--line);box-shadow:0 30px 60px -30px rgba(20,17,15,.45)}
.shotcap{font-size:13px;color:var(--muted);margin-top:10px}
.explain{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin:48px 0}
.explain figure{margin:0;border-top:1px solid var(--ink);padding-top:18px}
.explain svg{display:block;width:100%;height:auto;background:#14110F;border-radius:2px}
.explain h3{font-size:28px;margin:18px 0 6px}
@media (max-width:860px){.explain{grid-template-columns:1fr}}
/* svg loops */
@keyframes peel1{0%,15%,85%,100%{transform:translateY(0)}40%,60%{transform:translateY(-34px)}}
@keyframes peel2{0%,15%,85%,100%{transform:translateY(0)}40%,60%{transform:translateY(-17px)}}
@keyframes peel4{0%,15%,85%,100%{transform:translateY(0)}40%,60%{transform:translateY(17px)}}
@keyframes peel5{0%,15%,85%,100%{transform:translateY(0)}40%,60%{transform:translateY(34px)}}
.L1{animation:peel1 6s ease-in-out infinite}.L2{animation:peel2 6s ease-in-out infinite}.L4{animation:peel4 6s ease-in-out infinite}.L5{animation:peel5 6s ease-in-out infinite}
.lbl{opacity:0;animation:lblin 6s ease-in-out infinite}

function heroBand(eyebrow, h1, tagline, lede, photo, alt, actions){
  return `<section class="band" style="padding:0"><div class="wrap band-grid">
    <div class="band-text">
      <div class="eyebrow">${eyebrow}</div>
      <h1>${h1}</h1>
      ${tagline?`<div class="tagline">${tagline}</div>`:''}
      <p class="lede" style="margin-top:22px">${lede}</p>
      ${actions?`<div class="actions">${actions}</div>`:''}
    </div>
    <img class="photo" src="${IMG[photo]}" alt="${alt}">
  </div></section>`;
}

      <h2>One more step.</h2>
      <p>Hi ${esc(o.first)},</p>
      <p style="margin-top:12px">${lead}</p>
      <p style="margin-top:12px">Confirm your email so we can send your next steps and receipt.</p>
      <a class="cta" href="#/confirmed">Confirm my email</a>
      <table style="min-width:0;width:100%;margin-top:4px"><tbody>
        <tr><td style="text-align:left;padding:8px 0;color:#6C5C4B">Order</td><td style="text-align:right;padding:8px 0">${o.id}</td></tr>
        <tr><td style="text-align:left;padding:8px 0;color:#6C5C4B">${pr.name}</td><td style="text-align:right;padding:8px 0">${money(pr.price)}</td></tr>
      </tbody></table>
      <div class="foot">You're getting this because you started a checkout at prentice1.com. If that wasn't you, ignore this email.</div>
    </div></div>
  </div></div>`;
}
function confirmed(){
  const o = S.order; if(!o){ go('#/'); return ''; }
  if(!o.verified){ o.verified = true; save(); }
  const pr = PRODUCTS[o.p];
  const steps = {
    applicants:[['Done','Seat reserved and email confirmed'],['Next','Application review. Only the top 5% are accepted into the 20 seats'],['Then','Online training opens Jan 25, 2027'],['Later','Live week in Los Angeles from Mar 1, then Apprentice Day']],
    sponsors:[['Done','Sponsorship booked and email confirmed'],['Next','Partnerships call to set your session and product day'],['Then','Disclosure language approved in writing'],['Later','Your sessions run during Cohort 1']],
    practices:[['Done','Table reserved and email confirmed'],['Next','Tell us about your practice so we can match you'],['Then','Meet your 3 matches before the fair'],['Later','Interview at Apprentice Day and hire 1']]
  }[pr.aud];
  return `<div class="wrap"><div class="done">
    <div class="check" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#14110F" stroke-width="2.2"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1 style="font-size:clamp(44px,6vw,72px)">Email confirmed.</h1>
    <p class="lede" style="margin-top:20px">You're all set, ${esc(o.first)}. Here's what happens next.</p>
    <ul class="next">${steps.map((s,i)=>`<li><span class="state ${i===0?'ok':''}">${s[0]}</span><span>${s[1]}</span></li>`).join('')}</ul>
    <div class="actions"><a class="btn" href="#/">Back to Prentice1</a><button class="linkbtn" id="resetDemo">Start a new demo checkout</button></div>
  </div></div>`;
}

/* ---------- validation ---------- */
function setMsg(id,msg){ const e=document.getElementById(id+'-msg'); if(e) e.textContent=msg||''; const i=document.getElementById(id); if(i) i.setAttribute('aria-invalid',msg?'true':'false'); }
function validate(form, rules){
  let ok=true, first=null;
  for(const [id,fn] of Object.entries(rules)){
    const el=form.querySelector('#'+id); if(!el) continue;
    const m=fn((el.value||'').trim()); setMsg(id,m); if(m){ ok=false; first=first||el; }
  }
  if(first) first.focus();
  return ok;
}
const req = n => v => v ? '' : `Enter ${n}.`;
const emailRule = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? '' : 'Enter an email like name@example.com.';
const luhn = n => { let s=0,d=false; for(let i=n.length-1;i>=0;i--){ let x=+n[i]; if(d){x*=2;if(x>9)x-=9;} s+=x; d=!d; } return s%10===0; };

/* ---------- router ---------- */
function render(){
  const h = location.hash.replace(/^#/,'') || '/';
  const parts = h.split('/').filter(Boolean);
  let html = '';
  const top = parts[0]||'';
  if(top==='') html = home();
  else if(top==='applicants') html = applicants();
  else if(top==='sponsors') html = sponsors();
  else if(top==='practices') html = practices();
  else if(top==='checkout' && PRODUCTS[parts[1]]){
    if(S.p!==parts[1]){ S.p=parts[1]; S.form={}; S.method='card'; S.cherry=false; S.plan=24; save(); }
    html = parts[2]==='pay' ? payment(parts[1]) : details(parts[1]);
  }
  else if(top==='confirmation' && PRODUCTS[parts[1]]) html = confirmation(parts[1]);
  else if(top==='email') html = emailView();
  else if(top==='confirmed') html = confirmed();
  else html = `<div class="wrap done"><h1>Page not found.</h1><p class="lede" style="margin-top:16px">That link doesn't go anywhere. Head back to the home page.</p><div class="actions"><a class="btn" href="#/">Go home</a></div></div>`;
  app.innerHTML = html;
  const aud = top==='checkout'||top==='confirmation' ? (PRODUCTS[parts[1]]||{}).aud : top;
  document.querySelectorAll('[data-nav]').forEach(a=>a.toggleAttribute('aria-current', a.dataset.nav===aud) || a.setAttribute('aria-current', a.dataset.nav===aud?'page':'false'));
  document.querySelectorAll('[data-nav]').forEach(a=>{ if(a.dataset.nav!==aud) a.removeAttribute('aria-current'); else a.setAttribute('aria-current','page'); });
  document.getElementById('links').classList.remove('open');
  document.getElementById('menuBtn').setAttribute('aria-expanded','false');
  window.scrollTo(0,0);
  app.focus({preventScroll:true});
  wire(top, parts);
  setupMotion();
}
function wire(top, parts){
  app.querySelectorAll('[data-wk]').forEach(b=>b.addEventListener('click',()=>{
    S.wk=+b.dataset.wk; save();
    app.querySelectorAll('[data-wk]').forEach(x=>x.setAttribute('aria-pressed', x===b));
    const d=app.querySelector('.wkdetail'); const i=S.wk;
    d.innerHTML=wkText(i);
  }));
  const df = document.getElementById('detailsForm');
  if(df){
    const aud = PRODUCTS[S.p].aud;
    df.addEventListener('input', e=>{ S.form=S.form||{}; S.form[e.target.name]=e.target.value; save(); setMsg(e.target.id,''); });
    df.addEventListener('change', e=>{ S.form=S.form||{}; S.form[e.target.name]=e.target.value; save(); });
    df.addEventListener('submit', e=>{
      e.preventDefault();
      const rules = {first:req('your first name'), last:req('your last name'), email:emailRule};
      if(aud==='applicants') Object.assign(rules,{license:req('your license type'), state:v=>/^[A-Za-z]{2}$/.test(v)?'':'Enter the 2-letter state, like CA.'});
      if(aud==='sponsors') Object.assign(rules,{company:req('your company'), title:req('your job title'), product:req('the product')});
      if(aud==='practices') Object.assign(rules,{company:req('your practice name'), city:req('your city'), role:req('the role you are hiring for')});
      if(validate(df,rules)) go(`#/checkout/${S.p}/pay`);
    });
  }
  const pf = document.getElementById('payForm');
  if(pf){
    if(!S.form || !S.form.email){ go(`#/checkout/${S.p}`); return; }
    const pr = PRODUCTS[S.p];
    document.getElementById('backBtn').addEventListener('click',()=>go(`#/checkout/${S.p}`));
    const refreshPane=()=>{ document.getElementById('methodPane').innerHTML=methodPane(S.method,pr); document.getElementById('payBtn').textContent=payLabel(S.method,pr); wireCherry(); };
    pf.addEventListener('change', e=>{
      if(e.target.name==='method'){ S.method=e.target.value; save(); refreshPane(); }
      if(e.target.name==='plan'){ S.plan=+e.target.value; save(); }
    });
    pf.addEventListener('input', e=>{
      const t=e.target;
      if(t.id==='card'){ const d=t.value.replace(/\D/g,'').slice(0,16); t.value=d.replace(/(.{4})/g,'$1 ').trim(); }
      if(t.id==='exp'){ let d=t.value.replace(/\D/g,'').slice(0,4); if(d.length>2) d=d.slice(0,2)+'/'+d.slice(2); t.value=d; }
      if(t.id==='cvc'){ t.value=t.value.replace(/\D/g,'').slice(0,4); }
      setMsg(t.id,'');
    });
    function wireCherry(){
      const b=document.getElementById('cherryCheck'); if(!b) return;
      b.addEventListener('click',()=>{
        if(!validate(pf,{dob:v=>/^\d{2}\/\d{2}\/\d{4}$/.test(v)?'':'Enter your date of birth as MM/DD/YYYY.', income:req('your annual income')})) return;
        b.disabled=true; b.innerHTML='<span class="spinner" aria-hidden="true"></span> Checking';
        setTimeout(()=>{ S.cherry=true; save(); refreshPane(); },1200);
      });
    }
    wireCherry();
    pf.addEventListener('submit', e=>{
      e.preventDefault();
      const m=S.method; let rules={}, last4='';
      if(m==='card'){
        rules={cardname:req('the name on the card'),
          card:v=>{const d=v.replace(/\s/g,''); return d.length<15?'Enter the full card number.':!luhn(d)?'That card number isn\u2019t valid. Check the digits.':'';},
          zip:v=>/^\d{5}$/.test(v)?'':'Enter a 5-digit ZIP.',
          exp:v=>{const m=v.match(/^(\d{2})\/(\d{2})$/); if(!m) return 'Enter the expiry as MM/YY.'; const mm=+m[1], yy=2000+ +m[2]; if(mm<1||mm>12) return 'Enter a month from 01 to 12.'; const now=new Date(); return (yy<now.getFullYear()||(yy===now.getFullYear()&&mm<now.getMonth()+1))?'This card has expired.':'';},
          cvc:v=>/^\d{3,4}$/.test(v)?'':'Enter the 3 or 4 digit CVC.'};
        const c=pf.querySelector('#card'); last4=c?c.value.replace(/\s/g,'').slice(-4):'';
      } else if(m==='invoice'){ rules={billing:emailRule}; }
      else if(m==='cherry' && !S.cherry){ const b=document.getElementById('cherryCheck'); b&&b.focus(); return; }
      if(!validate(pf,rules)) return;
      const btn=document.getElementById('payBtn'); btn.disabled=true; btn.innerHTML='<span class="spinner" aria-hidden="true"></span> Processing';
      setTimeout(()=>{
        S.order={ id:'P1-'+Math.random().toString(36).slice(2,8).toUpperCase(), p:S.p, method:m, plan:S.plan, last4,
          email:S.form.email, first:S.form.first, city:S.form.city, verified:false };
        save(); go(`#/confirmation/${S.p}`);
      },1400);
    });
  }
  const r=document.getElementById('resetDemo');
  if(r) r.addEventListener('click',()=>{ S={}; save(); go('#/'); });
}

/* ---------- motion + scroll inversion ---------- */
const DARK={paper:[20,17,15],'paper-2':[31,26,22],ink:[252,248,242],text:[226,216,200],muted:[176,160,139],line:[60,51,43],'gold-deep':[217,188,134]};
const LIGHT={paper:[252,248,242],'paper-2':[247,240,229],ink:[20,17,15],text:[34,26,20],muted:[108,92,75],line:[228,216,196],'gold-deep':[122,94,40]};
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastT=-1;
function setTheme(t){
  if(Math.abs(t-lastT)<0.002) return; lastT=t;
  const st=document.documentElement.style;
  for(const k in LIGHT){ const c=LIGHT[k].map((v,i)=>Math.round(DARK[k][i]+(v-DARK[k][i])*t)); st.setProperty('--'+k,`rgb(${c.join(',')})`); }
  document.documentElement.style.colorScheme = t<0.5?'dark':'light';
  const m=document.querySelector('meta[name=theme-color]'); if(m) m.content=`rgb(${(t<0.5?DARK:LIGHT).paper.join(',')})`;
}
function themeProgress(){
  const band=app.querySelector('.band'); if(!band) return 1;
  const b=band.getBoundingClientRect().bottom, vh=innerHeight;
  let t=(vh*0.6-b)/(vh*0.45); t=Math.min(1,Math.max(0,t));
  return t*t*(3-2*t);
}
let ticking=false;
function onScroll(){
  if(ticking) return; ticking=true;
  requestAnimationFrame(()=>{
    ticking=false;
    setTheme(themeProgress());
    const max=document.documentElement.scrollHeight-innerHeight;
    document.getElementById('prog').style.transform=`scaleX(${max>0?scrollY/max:0})`;
  });
}
addEventListener('scroll',onScroll,{passive:true}); addEventListener('resize',onScroll);
function countUp(el){
  const end=+el.dataset.count; if(RM){el.textContent=end;return;}
  const t0=performance.now(), dur=1600;
  const step=now=>{ const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,4); el.textContent=Math.round(end*e); if(p<1) requestAnimationFrame(step); };
  el.textContent='0'; requestAnimationFrame(step);
}
let io;
function setupMotion(){
  lastT=-1; onScroll();
  // hero headline word split
  app.querySelectorAll('.band h1').forEach(h=>{
    const words=h.textContent.trim().split(/\s+/);
    h.setAttribute('aria-label',h.textContent.trim());
    h.innerHTML=words.map((w,i)=>`<span class="w" aria-hidden="true"><span style="--i:${i}">${w}</span></span>`).join(' ');
  });
  app.querySelectorAll('.band .eyebrow,.band .tagline,.band .lede,.band .actions').forEach((el,i)=>{ el.classList.add('hf'); el.style.setProperty('--d',(0.35+i*0.12)+'s'); });
  if(io) io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{
    if(!e.isIntersecting) return;
    e.target.classList.add('in'); io.unobserve(e.target);
    e.target.querySelectorAll?.('[data-count]').forEach(countUp);
  }),{threshold:0.18, rootMargin:'0px 0px -6% 0px'});
  const groups=['section h2','.cohortbar>*','.select>*','.facts>div','.aud>a','.list li','.steps>div','.oneone','.lead>div','.creds li','.compare>div','.tiers tr','.panel','.wkdetail','.handrow','.explain figure','.astats>div','.aday h2','.aday .lede','.done>*','.co>div>*:not(form)','.summary'];
  groups.forEach(sel=>{
    let i=0; app.querySelectorAll(sel).forEach(el=>{
      if(el.closest('.band')) return;
      el.classList.add('rv'); el.style.setProperty('--d',(Math.min(i++,8)*0.08)+'s'); io.observe(el);
    });
  });
  app.querySelectorAll('.portrait,.shot').forEach(el=>{ el.classList.add('clip'); io.observe(el); });
  app.querySelectorAll('.track,.agenda').forEach(el=>io.observe(el));
}

document.getElementById('menuBtn').addEventListener('click',e=>{
  const l=document.getElementById('links'); const o=l.classList.toggle('open'); e.currentTarget.setAttribute('aria-expanded',o);
});
window.addEventListener('hashchange', render);
render();
</script>
